#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

#[safe_z_home]
##  Replaced by [homing_override] below for sensorless XY homing
#home_xy_position:125,125
#speed:100
#z_hop:10

[homing_override]
axes: xyz
set_position_z: 0
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    # Lift well clear of the probe and nearby hardware before any XY travel.
    G91
    G0 Z0 F1800
    G90

    # Home Y first, then X, so the toolhead stays out of the X > 100 / Y < 50 obstruction zone.
    {% if home_all or 'Y' in params %}
        G28 Y
        G0 Y190 F6000
    {% endif %}

    {% if home_all or 'X' in params %}
        G28 X
    {% endif %}

    # Move in X first, then Y, to reach the Z endstop without crossing the obstruction.
    {% if home_all or 'Z' in params %}
        G0 X-12 F6000
        G0 Y6 F6000
        G28 Z
        G0 Z56 F1800
        G0 Y140 F6000
    {% endif %}

