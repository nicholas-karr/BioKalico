#####################################################################
#   Image Display / Projector
#####################################################################

[image_display]
host: 127.0.0.1
port: 5555
timeout: 5.0
load_timeout: 120.0
startup_timeout: 60
# Path to the DRM connector status file for this projector's HDMI/DP output.
# When this file reads "connected", PROJECTOR_ON succeeds immediately so the
# user can power the projector with the physical button instead of serial.
# Find the right connector with: cat /sys/class/drm/card*-*/status
screen_detect_path: /sys/class/drm/card1-HDMI-A-2/status


#####################################################################
#   Macros
#####################################################################
[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    # Z_TILT_ADJUST requires an active [z_tilt] section and probe.
    # Keep it disabled for minimal wiring bring-up.
    #Z_TILT_ADJUST
    #G28
    G0 X10 Y190 Z30 F3600

    ##  Uncomment for 300 build
    #G0 X10 Y190 Z30 F3600

    ##  Uncomment for 350mm build
    #G0 X10 Y190 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
# Assume FFF only print when this is used with no parameters
gcode:
    {% set materials = params.MATERIALS | default('') | string %}
    {% set ns = namespace(has_sla=false) %}
    {% for mat in materials.split(',') %}
        {% if mat.strip().lower().startswith('sla') %}
            {% set ns.has_sla = true %}
        {% endif %}
    {% endfor %}
    G32                            ; home all axes
    G90                            ; absolute positioning
    G1 Z20 F3000                   ; move nozzle away from bed
    {% if ns.has_sla %}
        PROJECTOR_ON
        M302 P1                    ; allow cold extrusion, SLA has no heated extruder
    {% endif %}


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    #G92 E0                         ; zero the extruder
    G1 E-2.0 F3600                 ; retract filament

    M302 P0                            ; restore cold extrude guard
    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    #G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    #G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    PROJECTOR_STANDBY

