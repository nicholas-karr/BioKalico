# Template config for the Printess open-source syringe-extrusion
# bioprinter (https://printess.org, manual:
# https://printess.org/Printess%20Construction%20and%20Operation%20Manual.pdf,
# CAD/firmware: https://github.com/weiss-jonathan/Printess-Low-Cost-3D-Printer).
#
# *** UNTESTED - THIS HAS NEVER RUN ON REAL HARDWARE. ***
# The manual only documents Marlin; Printess has no Klipper config of its
# own to work from. Everything below (pin assignments taken from the
# generic Octopus template, rotation_distance/microsteps math, the whole
# no-endstop/manual_stepper/dummy-heater axis-mapping approach) is a
# from-scratch port reasoned out from the manual's BOM and axis
# descriptions, not verified against an actual Printess. Treat every
# value here as a starting point to check against your own build - most
# likely to be wrong: pin assignments (confirm against your specific
# Octopus/Octopus Pro revision), full_steps_per_rotation, run_current,
# and sense_resistor (none of these are specified in the manual).
#
# The stock build runs Marlin on a RUMBA+ or BigTreeTech Octopus board and
# talks to Pronterface using a nonstandard axis layout:
#   Stage axes:     X, Y   (build platform, moves under a fixed syringe head)
#   Vertical axes:  Z, A   (independent height of syringe 1 / syringe 2)
#   Extrusion axes: B, C   (plunger of syringe 1 / syringe 2)
# All six are the same "T6*1" (Tr6x1, 1 mm lead) linear stepper: four with
# 100 mm stroke (X/Y/Z/A) and two with 50 mm stroke (B/C), driven by 6x
# TMC2208 in UART mode. This template ports that layout to Klipper on the
# Octopus (standard, non-Pro; pinout also matches Octopus Pro for these
# purposes) instead of Marlin:
#   - X, Y, Z stay real kinematic steppers so G90/G91/G92/G1/G2/G3 work as
#     documented in the manual.
#   - A (second syringe height) and C (second syringe plunger) become
#     [manual_stepper]s, moved with MANUAL_STEPPER or the macros below -
#     same pattern BioTrident's config (config/biotrident.cfg) uses for
#     its own second syringe axis.
#   - B (first syringe plunger) is a normal [extruder], with a disabled
#     "dummy" heater - Klipper requires an extruder to have one, but this
#     machine "does not have any heating accessories" per the manual.
#
# *** THINGS TO CHANGE/CHECK BEFORE USE: ***
#   - [mcu] serial:                  placeholder - see `ls -l /dev/serial/by-id/`
#   - full_steps_per_rotation on all steppers - 200 (1.8 deg) is the common
#     default for these linear steppers but wasn't specified in the BOM;
#     verify against your actual motors.
#   - run_current on all [tmc2208 ...] sections - unspecified in the
#     manual; 0.5 A is a conservative starting point for these small
#     lead-screw steppers, tune up only if you see skipped steps.
#   - sense_resistor on all [tmc2208 ...] sections - also unspecified;
#     0.110 ohm is the common default on generic TMC2208 breakout
#     modules, but check the boards you actually bought.
#   - endstop_pin on stepper_x/y/z - the base kit ships with NO endstops
#     (see "Homing" section below); these pins are just where the
#     optional endstop upgrade would plug in on the Octopus.
#   - nozzle_diameter / filament_diameter on [extruder] - set for a BD
#     1 mL syringe + 18ga needle; change filament_diameter to match
#     whichever syringe barrel you have mounted (see the ID table in
#     "Homing and syringe axes" below).

[mcu]
##  Octopus is STM32F446 or STM32F429 depending on revision - see
##  config/generic-bigtreetech-octopus-v1.1.cfg for the matching
##  "make menuconfig" bootloader/clock settings.
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_XXXXXXXXXXXXXXXXXXXXXXXX-if00
restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: cartesian
##  The manual explicitly warns these motors stall above ~F300 (mm/min,
##  i.e. 5 mm/s) - "Change XY motor rate to 300. It is default to 3000.
##  This is too fast for the motors and they will stall." Keep velocity
##  and accel low; raise only after confirming your motors/current don't
##  skip steps at a higher rate.
max_velocity: 5
max_accel: 100
max_z_velocity: 5
max_z_accel: 100

#####################################################################
#   Stage (X/Y) Stepper Settings - 100mm stroke, T6x1 lead screw
#####################################################################

# Driver0 on Octopus
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
##  T6x1 = Tr6x1 lead screw, 1 mm travel per revolution.
rotation_distance: 1
microsteps: 16
full_steps_per_rotation: 200   #verify against your stepper - 1.8deg NEMA assumed
##  Base kit has no endstop wired here - see "Homing" notes below.
endstop_pin: PG6
position_min: 0
position_endstop: 0
position_max: 100
homing_speed: 5

[tmc2208 stepper_x]
uart_pin: PC4
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

# Driver1 on Octopus
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 1
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: PG9
position_min: 0
position_endstop: 0
position_max: 100
homing_speed: 5

[tmc2208 stepper_y]
uart_pin: PD11
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

#####################################################################
#   Vertical Stepper Settings - 100mm stroke, T6x1 lead screw
#####################################################################

# Driver2 on Octopus - Syringe 1 height (Z in the manual's axis naming)
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 1
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: PG10
position_min: 0
position_endstop: 0
position_max: 100
homing_speed: 5

[tmc2208 stepper_z]
uart_pin: PC6
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

# Driver3 on Octopus - Syringe 2 height (A in the manual's axis naming).
# manual_stepper, not a kinematic axis - no endstop needed, moved only via
# MANUAL_STEPPER / the SYRINGE2_* macros below.
[manual_stepper syringe2_lift]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
rotation_distance: 1
microsteps: 16
full_steps_per_rotation: 200
velocity: 5
accel: 100

[tmc2208 manual_stepper syringe2_lift]
uart_pin: PC7
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

#####################################################################
#   Extrusion (Syringe Plunger) Stepper Settings
#   50mm stroke, T6x1 lead screw
#####################################################################

# Driver4 on Octopus - Syringe 1 plunger (B in the manual's axis naming).
# Real [extruder] so slicer/Pronterface E-moves (renamed from B per the
# manual's own "replace the E's" note) work through the normal toolhead.
# Klipper requires a heater on every extruder; this one is a dummy -
# min/max_temp are set absurdly wide and PID gains to 0 so it never
# actually tries to heat anything, matching the same trick used for
# BioTrident's second syringe in config/biotrident.cfg.
[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 1
microsteps: 16
full_steps_per_rotation: 200
##  Syringe barrel inner diameter stands in for filament_diameter, same
##  volumetric-flow math the manual's own extrusion-distance script uses.
##  1mL=4.9  3mL=8.6  5mL=12.0  10mL=14.4 (mm) - match your syringe size.
filament_diameter: 4.9
nozzle_diameter: 0.840   #18ga blunt dispensing needle
max_extrude_only_distance: 60
heater_pin: PA2   #HE0 - unused, no physical heater is connected
sensor_type: Generic 3950
sensor_pin: PF4   #T0 - unused, no physical thermistor is connected
min_temp: -273.15
max_temp: 999999
min_extrude_temp: -273.15
control: pid
pid_kp: 1
pid_ki: 0
pid_kd: 0

[tmc2208 extruder]
uart_pin: PF2
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

# Driver5 on Octopus - Syringe 2 plunger (C in the manual's axis naming,
# for dual-material dispensing). manual_stepper, moved via the
# SYRINGE2_DISPENSE / SYRINGE2_RETRACT macros below.
[manual_stepper syringe2_extruder]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 1
microsteps: 16
full_steps_per_rotation: 200
velocity: 5
accel: 100

[tmc2208 manual_stepper syringe2_extruder]
uart_pin: PE4
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 999999

#####################################################################
#   Homing and syringe axes
#####################################################################
# The base Printess kit ships with NO endstops - "End-stops... Enable
# homing. Requires additional adapters and modification of Marlin
# firmware" is listed as an optional upgrade in the manual, and the
# manual's whole G-code workflow is G92-based (zero the current position
# by hand) rather than G28. Calling G28 on this config as-is will just
# hang waiting for switches that don't exist.
#
# Until you install real endstops, use PRINTESS_ZERO (below) at the start
# of every session instead of G28 - it's the Klipper equivalent of the
# manual's "G92 X0 Y0" reset, using SET_KINEMATIC_POSITION / MANUAL_STEPPER
# SET_POSITION so Klipper accepts motion commands without ever having homed.
#
# If you do add the optional endstop upgrade, wire the switches to the
# pins already assigned above (endstop_pin: PG6/PG9/PG10) and switch back
# to a normal G28 at the start of PRINTESS_ZERO.

[idle_timeout]
timeout: 1800

#####################################################################
#   Macros
#####################################################################
# UNTESTED - see the header of this file. These macros (including the
# SET_KINEMATIC_POSITION-based zeroing in PRINTESS_ZERO) have not been
# run against real Printess hardware.

[gcode_macro PRINTESS_ZERO]
description: Zero all axes at their current physical position, without homing. Klipper equivalent of the manual's "G90 / G92 X0 Y0" reset - run this once per session before any motion, since the base kit has no endstops to G28 against.
gcode:
    SET_KINEMATIC_POSITION X=0 Y=0 Z=0
    MANUAL_STEPPER STEPPER=syringe2_lift SET_POSITION=0
    MANUAL_STEPPER STEPPER=syringe2_extruder SET_POSITION=0
    G92 E0
    G90

[gcode_macro SYRINGE2_LIFT]
description: Move syringe 2's independent height axis (A). DISTANCE=mm (signed, relative) SPEED=mm/s
gcode:
    {% set d = params.DISTANCE|default(1.0)|float %}
    {% set s = params.SPEED|default(5)|float %}
    MANUAL_STEPPER STEPPER=syringe2_lift MOVE={d} SPEED={s} ACCEL=100

[gcode_macro SYRINGE2_DISPENSE]
description: Push syringe 2's plunger (C). DISTANCE=mm SPEED=mm/s
gcode:
    {% set d = params.DISTANCE|default(1.0)|float %}
    {% set s = params.SPEED|default(5)|float %}
    MANUAL_STEPPER STEPPER=syringe2_extruder MOVE={d} SPEED={s} ACCEL=100

[gcode_macro SYRINGE2_RETRACT]
description: Pull syringe 2's plunger (C). DISTANCE=mm SPEED=mm/s
gcode:
    {% set d = params.DISTANCE|default(1.0)|float %}
    {% set s = params.SPEED|default(5)|float %}
    MANUAL_STEPPER STEPPER=syringe2_extruder MOVE=-{d} SPEED={s} ACCEL=100
