# Automatic recovery from a Klipper MCU shutdown and, if enabled, a dropped
# SLA projector serial link. Never acts while a print is running, and never
# undoes an emergency stop. Each action is sent as an auto_recovery_action
# event; add it to a [notifier]'s `events:` to get alerts. Every option is
# described under [auto_recovery] in deps/moonraker/docs/configuration.md.
#
# The paths differ per machine, so to turn on projector recovery, add this
# to moonraker.conf after the include, with your own paths:
#   [auto_recovery]
#   projector_recovery_enabled: true
#   projector_usb_port_path: /sys/bus/usb/devices/<bus-hub>:1.0/<bus-hub>-port<N>

[auto_recovery]
mcu_recovery_enabled: true
mcu_recovery_max_attempts: 2
mcu_recovery_cooldown_seconds: 120
# Reboot the host once per fault after the restarts fail. Off by default;
# turn it on per printer in moonraker.conf.
mcu_recovery_reboot_enabled: false
