# Backs the "Firmware" panel injected into Mainsail's Settings page
# (biokalico_extras/mainsail/firmware-panel.js) with build/flash endpoints for
# the [firmware_build <name>] targets declared in printer.cfg.
#
# [firmware_build] config options (see biokalico_extras/moonraker/firmware_build.py):
#   klipper_repo:     path to this repo (default: ~/klipper)
#   printer_cfg_path: path to printer.cfg (default: <data_path>/config/printer.cfg)

[firmware_build]
klipper_repo: ~/klipper
