# ---------------------------------------------------------------------------
# SLA Projector: power-panel buttons in Mainsail
# ---------------------------------------------------------------------------
# These appear in Mainsail's Power panel.
#   "Projector":         persistent toggle; turns the projector on or off.
#   "Projector Clear":   momentary button; blacks out the display immediately.
#   "Projector Standby": momentary button; arms the 5-minute idle-off timer.
#
# Macro targets are defined in biokalico_extras/printer/projector_panel.cfg.

[power Projector]
type: klipper_device
object_name: gcode_macro PROJECTOR_POWER

[power Projector Clear]
type: klipper_device
object_name: gcode_macro PROJECTOR_CLEAR_BTN
timer: 0.5

[power Projector Standby]
type: klipper_device
object_name: gcode_macro PROJECTOR_STANDBY_BTN
timer: 0.5
