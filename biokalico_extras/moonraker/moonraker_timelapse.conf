# Per-print timelapse: one frame per layer (TIMELAPSE_TAKE_FRAME, see
# biokalico_extras/printer/timelapse_macros.cfg), made into a video after each
# print. See biokalico_extras/README.md.
#
# Off by default because it adds CPU load on a Raspberry Pi. Turn it on here
# or in Mainsail's Timelapse settings. Options set here can't be changed in
# Mainsail. Options: see [timelapse] in deps/moonraker/docs/configuration.md.

[timelapse]
enabled: False
