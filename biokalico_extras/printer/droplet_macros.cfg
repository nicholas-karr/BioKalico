######################################################################
# Droplets (BioSlicer)
######################################################################
# Glob-included automatically as part of printer/*.cfg. The slicer emits one
# BIOSLICER_DROPLET per droplet point, for a droplet channel (channel_type
# 'droplet'). It carries the volume, not the pulse time: the pulse time is
# the volume divided by the calibration constant of the material, which the
# G-code file writes into BIOSLICER_PROCESS_PARAMS and which can be overridden
# before a print with
#
#   BIOSLICER_OVERRIDE PARAM=droplet_nl_per_us EXTRUDER=7 VALUE=0.04
#
# The valve is a [pulse_pin <name>] section; set variable_pin to its name.
# The limits of that module apply: a pulse of at least 100 us and at most 10%
# duty, which the slicer checks too.
#
#   BIOSLICER_DROPLET EXTRUDER=<i> X=<mm> Y=<mm> Z=<mm> SAFE_Z=<mm> VOLUME_NL=<nL> [COUNT=<n>]
#
# Z is the height of the nozzle at the point, SAFE_Z the height it travels at
# between points (the slicer sets it above the print). COUNT drops are fired
# at the rate in droplet_frequency.

[gcode_macro BIOSLICER_DROPLET]
description: Move to a droplet point and dispense it. BIOSLICER_DROPLET EXTRUDER=7 X=120 Y=95 Z=2.2 SAFE_Z=2.2 VOLUME_NL=50 COUNT=1
variable_pin: "microfluidic_control"
variable_xy_speed: 6000
variable_z_speed: 900
gcode:
    {% set m = printer["gcode_macro BIOSLICER_PROCESS_PARAMS"] %}
    {% set ext = params.EXTRUDER | int %}
    {% set x = params.X | float %}
    {% set y = params.Y | float %}
    {% set z = params.Z | float %}
    {% set safe_z = params.SAFE_Z | default(params.Z) | float %}
    {% set volume = params.VOLUME_NL | float %}
    {% set count = params.COUNT | default(1) | int %}
    {% set own = printer["gcode_macro BIOSLICER_DROPLET"] %}

    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("Home the printer first (G28).") }
    {% endif %}
    {% if ext not in m.droplet_nl_per_us and ext not in m.override_droplet_nl_per_us %}
        { action_raise_error("No droplet calibration for extruder %d. The G-code file sets it at its start." % ext) }
    {% endif %}

    # The override wins over the sliced value, like for SLA exposure.
    {% set nl_per_us = m.override_droplet_nl_per_us[ext] if ext in m.override_droplet_nl_per_us else m.droplet_nl_per_us[ext] %}
    {% set frequency = m.override_droplet_frequency[ext] if ext in m.override_droplet_frequency else (m.droplet_frequency[ext] if ext in m.droplet_frequency else 1.0) %}
    {% set settle = m.override_droplet_settle[ext] if ext in m.override_droplet_settle else (m.droplet_settle[ext] if ext in m.droplet_settle else 0.2) %}

    {% if nl_per_us <= 0 %}
        { action_raise_error("The volume per pulse of extruder %d is not positive." % ext) }
    {% endif %}
    {% set width_us = (volume / nl_per_us) | round | int %}
    {% if width_us < 100 %}
        { action_raise_error("%.4g nL needs a pulse of %d us at %.4g nL/us; the valve pulses 100 us at least." % (volume, width_us, nl_per_us)) }
    {% endif %}

    G90
    # Rise to the travel height before moving over, so a dipped nozzle does not drag through liquid.
    {% if printer.gcode_move.gcode_position.z < safe_z %}
        G0 Z{safe_z} F{own.z_speed}
    {% endif %}
    G0 X{x} Y{y} F{own.xy_speed}
    G0 Z{z} F{own.z_speed}
    M400
    {% if settle > 0 %}
        G4 P{(settle * 1000) | int}
    {% endif %}

    # TRIGGERS_PER_SEC only matters for more than one drop. The pulse pin module caps the pulse rate.
    {% set rate = frequency if count > 1 else 1.0 %}
    START_PULSE_PIN PIN={own.pin} PULSE_WIDTH_US={width_us} TRIGGERS_PER_SEC={rate} TRIGGER_COUNT={count}
    # The pulses run on the MCU, M400 does not wait for them: dwell for the whole train.
    G4 P{(((count - 1) / rate + width_us / 1000000.0) * 1000 + 10) | round | int}
