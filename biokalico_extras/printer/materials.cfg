#####################################################################
#   Materials Tracking
#####################################################################
# Backs the "Materials" card on the Mainsail dashboard. See
# biokalico_extras/README.md, and docs/Config_Reference.md for every option.
#
# The materials below are the starting set. The card's "Manage Materials"
# dialog can edit them and add new ones, and those edits take priority. A
# material defined here can only be removed by deleting it here.
#
# The slot groups that hold these materials depend on the machine, so they
# are in its printer.cfg (see bio_config/biotrident.cfg).
#
# Material properties come from BioSlicer's UTDHBL.ini profile.
# params_slicer_token is the name BioSlicer puts in PRINT_START MATERIALS=.
#
# params_color is the default color for slots holding the material. Write it
# without the leading '#' (e.g. 9e9e9e), since '#' starts a comment here.

[materials]
state_file: ~/printer_data/config/materials_state.cfg

[material basic_pla]
display_name: Basic PLA
params_channel_type: fff
params_filament_type: PLA
params_temperature: 205
params_first_layer_temperature: 210
params_bed_temperature: 55
params_slicer_token: FFF_BASIC_PLA_BIOSLICERTRIDENT
params_color: e8e3d3

[material pcl_bioink]
display_name: PCL BioInk
params_channel_type: fff
params_filament_type: PCL
params_temperature: 95
params_first_layer_temperature: 100
params_bed_temperature: 25
params_max_volumetric_speed: 1.0
params_slicer_token: FFF_PCL_BIOINK_BIOSLICERTRIDENT
params_color: d9c7a3

[material standard_resin]
display_name: Standard Photopolymer Resin
params_channel_type: sla
params_filament_type: Resin
params_exposure_time: 5
params_delay_before_exposure: 3
params_slicer_token: SLA_STANDARD_PHOTOPOLYMER_RESIN_BIOSLICERTRIDENT
params_color: 9e9e9e

[material gelma_10]
display_name: GelMA 10%
params_channel_type: sla
params_filament_type: Hydrogel
params_temperature: 37
params_max_volumetric_speed: 0.5
params_exposure_time: 5
params_delay_before_exposure: 3
params_slicer_token: SLA_GELMA_10_BIOSLICERTRIDENT
params_color: f0d878

[material pegda_20]
display_name: PEGDA 20%
params_channel_type: sla
params_filament_type: Hydrogel
params_temperature: 22
params_max_volumetric_speed: 0.3
params_exposure_time: 5
params_delay_before_exposure: 3
params_slicer_token: SLA_PEGDA_20_BIOSLICERTRIDENT
params_color: cfe8f3

[material alginate_gelma]
display_name: Alginate-GelMA Bioink
params_channel_type: sla
params_filament_type: Hydrogel
params_temperature: 37
params_max_volumetric_speed: 0.2
params_exposure_time: 5
params_delay_before_exposure: 3
params_slicer_token: SLA_ALGINATE_GELMA_BIOINK_BIOSLICERTRIDENT
params_color: e8a9a0

# A droplet material is dispensed by a valve pulse: params_nl_per_us is the
# volume per microsecond of pulse. The slicer's value is written into the G-code
# and can be overridden with BIOSLICER_OVERRIDE PARAM=droplet_nl_per_us.
[material droplet_water]
display_name: Droplet - Water
params_channel_type: droplet
params_filament_type: Liquid
params_nl_per_us: 0.05
params_slicer_token: DROPLET_WATER_BIOSLICERTRIDENT
params_color: 9fc9e8
