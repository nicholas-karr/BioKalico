# projector_panel.cfg: Mainsail power-panel buttons for projector control.
#
# Each macro below is a klipper_device target for a Moonraker [power] section.
# Moonraker calls  MACRO VALUE=1  (press/on) and  MACRO VALUE=0  (release/off).
# Mainsail reads variable_value from the subscription to show the button state.
#
# The matching [power] entries live in moonraker.conf.
# After changing this file, restart Klipper + Moonraker.

######################################################################
# Power toggle: turns projector on or off
######################################################################
# Mainsail shows this as a persistent toggle switch.
# Note: PROJECTOR_ON blocks while the projector display connects (up to
# startup_timeout seconds). The button shows "loading" during that window.

[gcode_macro PROJECTOR_POWER]
description: Projector on/off toggle (Mainsail power-panel button)
variable_value: 0
gcode:
    {% set v = params.VALUE | default(0) | int %}
    SET_GCODE_VARIABLE MACRO=PROJECTOR_POWER VARIABLE=value VALUE={v}
    {% if v %}
        PROJECTOR_ON
    {% else %}
        PROJECTOR_OFF
    {% endif %}


# On Klipper startup, sync variable_value to the actual projector state.
# The 6-second delay lets image_display's background poll populate its status.
[delayed_gcode _projector_power_sync]
initial_duration: 6
gcode:
    {% set s = printer['image_display'] %}
    {% if s %}
        SET_GCODE_VARIABLE MACRO=PROJECTOR_POWER VARIABLE=value VALUE={1 if s.projector_on else 0}
    {% endif %}


######################################################################
# Black screen: clears the display immediately (momentary button)
######################################################################
# Moonraker timer: 0.5 s auto-resets it to "off" so it behaves like a button.

[gcode_macro PROJECTOR_CLEAR_BTN]
description: Clear projector display / show black (Mainsail momentary button)
variable_value: 0
gcode:
    {% set v = params.VALUE | default(0) | int %}
    SET_GCODE_VARIABLE MACRO=PROJECTOR_CLEAR_BTN VARIABLE=value VALUE={v}
    {% if v %}
        SLA_CLEAR
    {% endif %}


######################################################################
# Standby: arms the 5-minute idle-off timer (momentary button)
######################################################################
# The projector stays on for PROJECTOR_STANDBY_DELAY (300 s) then turns off.

[gcode_macro PROJECTOR_STANDBY_BTN]
description: Arm projector 5-min standby timer (Mainsail momentary button)
variable_value: 0
gcode:
    {% set v = params.VALUE | default(0) | int %}
    SET_GCODE_VARIABLE MACRO=PROJECTOR_STANDBY_BTN VARIABLE=value VALUE={v}
    {% if v %}
        PROJECTOR_STANDBY
    {% endif %}
