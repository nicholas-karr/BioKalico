# timelapse_macros.cfg: per-layer frame capture for the print timelapse
# feature (deps/moonraker/moonraker/components/timelapse.py).
#
# Call TIMELAPSE_TAKE_FRAME from the slicer's "after layer change" G-code.
# Moonraker sets the variables below from Mainsail's Timelapse settings, so
# don't edit them here.
#
# Parking is off by default. When on, it assumes a rectangular bed, moves in
# X/Y only, and needs [pause_resume]. Because Moonraker takes the picture a
# moment after this macro asks for it, parking pauses the print (the base
# PAUSE, skipping any custom park logic), moves, and waits for Moonraker to
# clear takingframe before resuming. moonraker-timelapse works the same way.

[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Park (if enabled), capture one timelapse frame, resume the print
variable_enable: False
variable_verbose: True
variable_takingframe: False
variable_park_enable: False
variable_park_pos: 'back_left'
variable_park_time: 0.1
variable_park_custom_x: 10.0
variable_park_custom_y: 10.0
variable_park_travel_speed: 100
variable_park_retract_speed: 15
variable_park_extrude_speed: 15
variable_park_retract_distance: 1.0
variable_park_extrude_distance: 1.0
variable_fw_retract: False
gcode:
    {% if not enable %}
        {% if verbose %}{action_respond_info("Timelapse: disabled, take-frame ignored")}{% endif %}
    {% elif park_enable and "xyz" in printer.toolhead.homed_axes %}
        {% set mn = printer.toolhead.axis_minimum %}
        {% set mx = printer.toolhead.axis_maximum %}
        {% set targets = {
             'center':      ((mn.x + mx.x) / 2.0, (mn.y + mx.y) / 2.0),
             'front_left':  (mn.x, mn.y),
             'front_right': (mx.x, mn.y),
             'back_left':   (mn.x, mx.y),
             'back_right':  (mx.x, mx.y),
             'custom':      (park_custom_x, park_custom_y) } %}
        {% set target = targets[park_pos] if park_pos in targets else targets['back_left'] %}
        {% set pause_cfg = printer.configfile.settings['gcode_macro pause'] %}
        {% set pause_cmd = pause_cfg.rename_existing if pause_cfg is defined else 'PAUSE' %}
        {pause_cmd}
        {% if printer[printer.toolhead.extruder].can_extrude %}
            {% if fw_retract %}
                G10
            {% else %}
                M83
                G1 E-{park_retract_distance} F{park_retract_speed * 60}
            {% endif %}
        {% elif verbose %}
            {action_respond_info("Timelapse: extruder below min temp, skipping retract")}
        {% endif %}
        G90
        G1 X{target[0]} Y{target[1]} F{park_travel_speed * 60}
        M400
        SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=takingframe VALUE=True
        UPDATE_DELAYED_GCODE ID=_TIMELAPSE_WAIT_RELEASE DURATION=0.1
        _TIMELAPSE_CAPTURE
    {% else %}
        {% if park_enable and verbose %}
            {action_respond_info("Timelapse: axes not homed, capturing without parking")}
        {% endif %}
        _TIMELAPSE_CAPTURE
    {% endif %}

[gcode_macro _TIMELAPSE_CAPTURE]
description: Internal - asks Moonraker to grab one frame
gcode:
    {action_call_remote_method("timelapse_newframe")}

[delayed_gcode _TIMELAPSE_WAIT_RELEASE]
gcode:
    {% set tl = printer['gcode_macro TIMELAPSE_TAKE_FRAME'] %}
    {% if tl.takingframe %}
        UPDATE_DELAYED_GCODE ID=_TIMELAPSE_WAIT_RELEASE DURATION=0.1
    {% else %}
        {% if printer[printer.toolhead.extruder].can_extrude %}
            {% if tl.fw_retract %}
                G11
            {% else %}
                G1 E{tl.park_extrude_distance} F{tl.park_extrude_speed * 60}
            {% endif %}
        {% endif %}
        {% set resume_cfg = printer.configfile.settings['gcode_macro resume'] %}
        {% set resume_cmd = resume_cfg.rename_existing if resume_cfg is defined else 'RESUME' %}
        {resume_cmd}
    {% endif %}
