# Simulated printer only. setup.sh appends this to bio_config/biotrident.cfg,
# and a section that appears twice is merged with the later value winning, so
# everything here layers on top of the real template. It adds what the
# template deliberately leaves out: docks, motion macros for two heads and a
# head on a non-critical board, so that every state the Toolheads card
# manages can be exercised.

# Everything physical the simulated heads are asked to do lands here, in
# order, so a test can check it.
[gcode_macro _SIMLOG]
variable_events: ""
gcode:
    SET_GCODE_VARIABLE MACRO=_SIMLOG VARIABLE=events VALUE="'{printer["gcode_macro _SIMLOG"].events ~ params.MSG ~ ";"}'"

[gcode_macro SIM_CLEAR_LOG]
gcode:
    SET_GCODE_VARIABLE MACRO=_SIMLOG VARIABLE=events VALUE="''"

# The syringe (the commented block in the template, on the main board).
[extruder1]
step_pin: PG7
dir_pin: !PG6
enable_pin: !PC7
rotation_distance: 1
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 1.0
filament_diameter: 1.75
max_extrude_only_distance: 500
heater_pin: PF7
sensor_type: Generic 3950
sensor_pin: PA2
min_temp: -273.15
max_temp: 999999
min_extrude_temp: -273.15
control: pid
pid_Kp: 1
pid_Ki: 0
pid_Kd: 0

# A head on its own board that can be plugged in and out (see usb_board.py).
[mcu usbhead]
serial: /tmp/sim-mcu-usb
is_non_critical: True
reconnect_interval: 1

[extruder2]
step_pin: usbhead:gpio23
dir_pin: usbhead:gpio24
enable_pin: !usbhead:gpio25
rotation_distance: 1
microsteps: 16
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: usbhead:gpio9
sensor_type: Generic 3950
sensor_pin: usbhead:gpio29
min_temp: -273.15
max_temp: 999999
min_extrude_temp: -273.15
control: pid
pid_Kp: 1
pid_Ki: 0
pid_Kd: 0

[toolchanger]
initialize_on: first-use
verify_tool_pickup: False

[tool nhk_tool]
extruder: extruder
pickup_gcode:
    _SIMLOG MSG="pickup nhk dock={tool.dock}"
dropoff_gcode:
    _SIMLOG MSG="dropoff nhk dock={tool.dock}"

[tool syringe_tool]
extruder: extruder1
pickup_gcode:
    _SIMLOG MSG="pickup syringe dock={tool.dock}"
dropoff_gcode:
    _SIMLOG MSG="dropoff syringe dock={tool.dock}"

# Materials the deployed template does not define.
[material pcl_bioink]
display_name: PCL BioInk
params_channel_type: fff
params_filament_type: PCL
params_slicer_token: FFF_PCL_BIOINK_BIOSLICERTRIDENT
params_color: 3f7fbf

[material silicone]
display_name: Silicone
params_channel_type: fff
params_filament_type: Silicone
params_slicer_token: FFF_SILICONE_BIOSLICERTRIDENT
params_color: c0c0c0

[material usb_ink]
display_name: USB ink
params_channel_type: fff
params_filament_type: Ink
params_slicer_token: FFF_USB_INK_BIOSLICERTRIDENT
params_color: 5fbf5f

[material_slots usb_head]
display_name: USB head
count: 1

[toolheads]
dock_count: 3

# nhk and the syringe can be exchanged by the printer; the solenoid can only
# be mounted by hand; the USB head follows its board.
[toolhead_unit nhk]
tool: nhk_tool

[toolhead_unit syringe]
tool: syringe_tool
initial_state: docked
initial_dock: 1

[toolhead_unit usb]
display_name: USB head
material_group: usb_head
mcu: usbhead
initial_state: unmounted
