# Config for toolheads testing: the real toolchanger engine driven by the
# toolheads registry, with macros that record what was asked of them.
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[extruder1]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# Every physical action appends to _LOG.events, so the test can check order.
[gcode_macro _LOG]
variable_events: ""
gcode:
    SET_GCODE_VARIABLE MACRO=_LOG VARIABLE=events VALUE="'{printer["gcode_macro _LOG"].events ~ params.MSG ~ ";"}'"

[virtual_sdcard]
path: /tmp

[toolchanger]
initialize_on: first-use
verify_tool_pickup: False

[tool pla_tool]
extruder: extruder
pickup_gcode:
    _LOG MSG="pickup {tool.name} dock={tool.dock}"
dropoff_gcode:
    _LOG MSG="dropoff {tool.name} dock={tool.dock}"

[tool gel_tool]
extruder: extruder1
pickup_gcode:
    _LOG MSG="pickup {tool.name} dock={tool.dock}"
dropoff_gcode:
    _LOG MSG="dropoff {tool.name} dock={tool.dock}"

[materials]
state_file: /tmp/klippy_test_toolheads_materials.cfg

[material pla]
display_name: PLA
params_slicer_token: FFF_PLA

[material gel]
display_name: Gel
params_slicer_token: FFF_GEL

[material resin_a]
display_name: Resin A
params_slicer_token: SLA_A

[material resin_b]
display_name: Resin B
params_slicer_token: SLA_B

[material_slots pla_head]
count: 1

[material_slots gel_head]
count: 1

[material_slots syringe]
count: 1

[material_slots vat]
count: 2

[toolheads]
state_file: /tmp/klippy_test_toolheads_state.cfg
dock_count: 2

[toolhead_unit pla]
tool: pla_tool
material_group: pla_head
initial_state: mounted

[toolhead_unit gel]
tool: gel_tool
material_group: gel_head
initial_state: docked
initial_dock: 1

[toolhead_unit syringe]
material_group: syringe

[material_selector turntable]
material_group: vat
select_gcode:
    _LOG MSG="vat {index} {material}"
