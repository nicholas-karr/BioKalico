# Test config for the tools_calibrate extra: nozzle contact probe plus the
# tool's own Z probe.
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
endstop_pin: ^PD3
position_endstop: 0.5
rotation_distance: 8
position_min: -5000
homing_positive_dir: false
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[probe]
pin: ^PH6
z_offset: 1.0

[tools_calibrate]
pin: ^PH4
probe: probe
travel_speed: 20
spread: 5
lower_z: 1.0
lift_z: 1.0
lift_speed: 4
final_lift_z: 6
trigger_to_bottom_z: 0.25

[gcode_macro CALIBRATION_RESULT]
variable_offset: 0.0, 0.0, 0.0
gcode:
