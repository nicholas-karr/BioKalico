# Minimal config for the materials extra tests. state_file is overridden by
# the test to point at a temp path.
[materials]
state_file: /tmp/materials_state_placeholder.cfg

[material resin_a]
display_name: Resin A
params_channel_type: sla
params_filament_type: Resin
# no leading '#', which would start a comment
params_color: 9e9e9e

[material pla]
display_name: PLA
params_channel_type: fff

[material_slots sla]
display_name: SLA
count: 3
# Only the active vat is uncovered.
uncovered_mode: auto

[material_slots toolhead1]
display_name: Toolhead 1 (nhk)
count: 1
active_slot: 1

[material_slots vat]
display_name: Vat (no cover installed)
count: 1
# No physical cover on this machine: every occupied slot is always uncovered.
uncovered_mode: always
