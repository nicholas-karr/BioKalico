# Config for the toolheads extra unit tests. Both state files are redirected
# to temp paths by the tests. Only the sections toolheads.py reads are needed.
[materials]
state_file: /tmp/materials_state_placeholder.cfg

[material pla]
display_name: PLA
params_slicer_token: FFF_PLA

[material gel]
display_name: Gel
params_slicer_token: FFF_GEL

[material bio]
display_name: Bio
params_slicer_token: FFF_BIO

[material usbmat]
display_name: USB material
params_slicer_token: FFF_USB

# Known to the slicer but held by no toolhead or selector.
[material lonely]
params_slicer_token: FFF_LONELY

[material resin_a]
display_name: Resin A
params_slicer_token: SLA_A

[material resin_b]
display_name: Resin B
params_slicer_token: SLA_B

[material_slots pla_head]
count: 1

[material_slots gel_head]
count: 1

[material_slots syringe]
count: 1

[material_slots usb_head]
count: 1

[material_slots vat]
count: 2

[mcu nhk]
serial: /dev/null
is_non_critical: True

[tool a]
[tool b]

[toolheads]
state_file: /tmp/toolheads_state_placeholder.cfg
dock_count: 2

# Mounted, has motion macros.
[toolhead_unit pla]
display_name: PLA head
tool: a
material_group: pla_head
initial_state: mounted

# Docked in dock 1, has motion macros.
[toolhead_unit gel]
display_name: Gel head
tool: b
material_group: gel_head
initial_state: docked
initial_dock: 1

# No motion macros: can only be mounted by hand.
[toolhead_unit syringe]
display_name: Syringe
material_group: syringe
initial_state: unmounted

# Follows a non-critical MCU.
[toolhead_unit usb]
display_name: USB head
material_group: usb_head
mcu: nhk
initial_state: unmounted

[material_selector turntable]
material_group: vat
select_gcode:
    SELECT_VAT SLOT={slot} INDEX={index} MATERIAL={material} GROUP={group}
